name: Build & Publish Multi-Arch Docker Image

on:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  build:
    name: Build Multi-Platform Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 获取版本号（优先 package.json）
      - name: Extract version
        id: vars
        run: |
          if [ -f package.json ]; then
            VERSION=$(jq -r '.version' package.json)
          else
            VERSION="0.0.0"
          fi

          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "GIT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Docker Cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build & Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/telebox:latest
            ghcr.io/${{ github.repository_owner }}/telebox:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/telebox:${{ env.GIT_SHA }}

          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Replace Docker Cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
