name: Build Multi-Arch Docker Image

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        run: |
          VER=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VER" >> $GITHUB_ENV
          echo "SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/telebox:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/telebox:latest
            ghcr.io/${{ github.repository_owner }}/telebox:stable
            ghcr.io/${{ github.repository_owner }}/telebox:sha-${{ env.SHA }}
