name: Sync TeleBox Official Version

on:
  schedule:
    - cron: "0 */3 * * *"   # 每 3 小时自动同步一次
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 必须：允许 tag 操作

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/TeleBoxOrg/TeleBox.git || true
          git fetch upstream

      - name: Merge upstream changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git merge upstream/main --no-edit || true

      - name: Read package.json version
        id: getver
        run: |
          VERSION=$(jq -r '.version' package.json)
          TAG="v$VERSION"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Check if version already exists
        run: |
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Version ${TAG} already exists, skipping tagging."
            exit 0
          fi

      - name: Create tag
        run: |
          git tag "${TAG}"

      - name: Push changes + tag
        run: |
          git push origin main
          git push origin "${TAG}"
